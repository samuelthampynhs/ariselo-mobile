# Ariselo's phone apps (Flutter): one codebase, two apps on each platform.
#
#   Ariselo Dev   uk.co.ariselo.app.dev   dev.ariselo.co.uk   built on every push to main
#   Ariselo       uk.co.ariselo.app       ariselo.co.uk       built for a version tag (v1.0.0)
#
#   pull request          -> analyse and test
#   push to main          -> analyse, test, build Ariselo Dev for Android (APK + app bundle)
#   tag v1.2.3            -> analyse, test, build Ariselo for Android
#   Actions > CI > Run    -> choose dev or prod, and whether to build for iPhone too (macOS:
#                            its minutes count 10x on GitHub's Free plan, so only when asked)
#
# Builds are unsigned for the stores until the signing keys are added (README, "Before the
# stores"); the Android APK is signed with a test key so it installs for trying.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        options: [dev, prod]
        default: dev
      ios:
        description: "Also build for iPhone (macOS runner)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: ${{ inputs.app || (startsWith(github.ref, 'refs/tags/v') && 'prod') || 'dev' }}

jobs:
  check:
    name: Analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: scripts/platforms.sh "$APP" ios,android
      - run: flutter pub get
      - name: Format (reported, not yet enforced)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  android:
    name: Build for Android
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: scripts/platforms.sh "$APP" android
      - run: flutter pub get
      - name: APK (installs on any Android phone, for trying)
        run: flutter build apk --release --dart-define-from-file="env/$APP.json"
      - name: App bundle (what Google Play takes)
        run: flutter build appbundle --release --dart-define-from-file="env/$APP.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ariselo-${{ env.APP }}-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    name: Build for iPhone
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: scripts/platforms.sh "$APP" ios
      - run: flutter pub get
      - name: Simulator build
        run: |
          flutter build ios --simulator --debug --dart-define-from-file="env/$APP.json"
          cd build/ios/iphonesimulator && zip -qry "../../../Ariselo-$APP-simulator.zip" Runner.app
      - name: Device build, unsigned
        run: flutter build ios --release --no-codesign --dart-define-from-file="env/$APP.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ariselo-${{ env.APP }}-ios-simulator
          path: Ariselo-${{ env.APP }}-simulator.zip
          retention-days: 14
